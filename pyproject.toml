[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "mayerpath"
version = "0.1.0"
description = "Persistent Mayer path homology and Mayer path Laplacians of directed graphs"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Dilan Karaguler"}]
requires-python = ">=3.9"
dependencies = ["numpy>=1.22", "scipy>=1.8"]

[project.optional-dependencies]
examples = ["matplotlib>=3.5"]
test = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
